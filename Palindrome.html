<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>
    <!-- Add creative fonts and styles -->
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(45deg, #ffcccb, #ccffcb);
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #333;
            font-size: 2.5em;
            font-family: 'Comic Sans MS', cursive;
        }
        form {
            margin-top: 20px;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 1em;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 15px;
            font-size: 1em;
            background-color: #5cb85c;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #4cae4c;
        }
        #result {
            margin-top: 20px;
            font-size: 1.2em;
            color: #444;
        }
    </style>
</head>
<body>
    <!-- Page Title -->
    <h1>Palindrome Checker</h1>

    <!-- Form to submit strings -->
    <form id="palindromeForm">

        <!-- Input field for the user -->
        <input type="text" id="userInput" placeholder="Enter a word or phrase" required>
        <!-- Submit button to check for palindrome -->
        <button type="submit">Check</button>
    </form>

    <!-- Div for displaying results -->
    <div id="result"></div>
<br>
<br>
    <!-- Add a creative image -->
    <img src="drome_meme.jpeg" alt="Funny Drome">

    <!-- Link JavaScript file -->
    <script src="palindrome.js"></script>
</body>
</html>
